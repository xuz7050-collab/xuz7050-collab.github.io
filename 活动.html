<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活动页面</title>

<style>
body{
    margin:0;
    padding:20px;
    min-height:100vh;

    background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.35),transparent 25%),
    radial-gradient(circle at 80% 80%,rgba(255,255,255,.25),transparent 30%),
    linear-gradient(135deg,#b7cde3 0%,#8faac5 50%,#c5d9ec 100%);
    color:#17385f;
    font-family:Arial,"Microsoft YaHei",sans-serif;
}

body::before{
    content:"★　✦　★　✦　★";
    position:fixed;
    top:35px;
    left:0;
    width:100%;
    text-align:center;
    font-size:30px;
    letter-spacing:60px;
    color:rgba(255,255,255,.9);
    pointer-events:none;
    z-index:0;
}

.page{
    max-width:1200px;
    margin:0 auto;
}

h1{
    text-align:center;
    margin:20px auto 40px;
    width:fit-content;
    padding:18px 90px;
    color:#fff;
    font-size:42px;
    font-weight:800;
    background:linear-gradient(135deg,#1976d2,#42a5f5);
    border-radius:0 0 28px 28px;
    box-shadow:0 8px 25px rgba(25,118,210,.25);
    position:relative;
    z-index:1;
}

.back{
    display:block;
    width:fit-content;
    margin:30px auto 10px;
    padding:10px 22px;
    border-radius:24px;
    background:#6735d8;
    color:#fff;
    text-decoration:none;
    font-size:16px;
    transition:.2s;
}

.back:hover{
    transform:translateY(-2px);
    opacity:.9;
}
    text-decoration:none;
}

.activity-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.activity-list img{
    width:100%;
    display:block;
    border-radius:14px;
}

@media(max-width:700px){
    .activity-list{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="page">

<h1>活动页面</h1>

<div class="activity-list">

<img src="9月合营佣金+新增活动-XK.jpg" alt="合营活动1">
<img src="9月合营首存复存活动-XK.png" alt="合营活动2">
<img src="9月限时热门活动(XK).png" alt="合营活动3">
<img src="9月月均日活奖励活动-XK.png" alt="合营活动4">
<img src="9月指定联赛冠军盘投注返利-XK.jpg" alt="合营活动5">
<img src="新人&首存类活动(XK).png" alt="合营活动6">

</div>

<!-- 底部标题 -->
<div class="bottom-title">
    <div class="bottom-title-main">
        活动中心
    </div>
    <div class="bottom-title-sub">
        精选活动 · 福利活动 · 限时活动
    </div>
</div>

<a href="index.html" class="back">← 返回首页</a>
</div>

</body>
</html>
