<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活动页面</title>

<style>
body{
    margin:0;
    padding:20px;
    min-height:100vh;

    background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.35),transparent 25%),
    radial-gradient(circle at 80% 80%,rgba(255,255,255,.25),transparent 30%),
    linear-gradient(135deg,#b7cde3 0%,#8faac5 50%,#c5d9ec 100%);
    color:#17385f;
    font-family:Arial,"Microsoft YaHei",sans-serif;
}
/* ===== 活动中心标题 ===== */
.bottom-title{
    width:100%;
    max-width:1200px;
    margin:45px auto 25px;
    text-align:center;
}

.bottom-title h1{
    margin:0 0 14px;
    padding:0;

    font-family:Arial,"Microsoft YaHei",sans-serif;
    font-size:52px;
    line-height:1.2;
    font-weight:800;
    letter-spacing:2px;

    color:#e9f7ff;

    text-align:center;

    text-shadow:
        0 0 10px rgba(60,180,255,.7),
        0 0 25px rgba(20,120,255,.45);
}


/* ===== 和 xiaxian.html 标题一致 ===== */
.bottom-title{
    width:100%;
    max-width:1280px;
    margin:0 auto;
    padding:55px 20px 30px;
    text-align:center;
    position:relative;
}

.bottom-title h1{
    margin:0 0 14px;
    padding:0;

    font-size:52px;
    line-height:1.2;
    font-weight:800;
    letter-spacing:2px;

    color:#e9f7ff;

    text-shadow:
        0 0 10px rgba(60,180,255,.7),
        0 0 25px rgba(20,120,255,.45);
}

.bottom-title p{
    margin:0;
    padding:0;

    font-size:22px;
    line-height:1.5;
    font-weight:400;

    color:#0878e8;

    letter-spacing:2px;
    text-align:center;
}

/* 标题下面的蓝色发光横线 */
.bottom-title::after{
    content:"";
    display:block;

    width:180px;
    height:3px;

    margin:25px auto 0;

    background:linear-gradient(
        90deg,
        transparent,
        #159cff,
        #5ee7ff,
        #159cff,
        transparent
    );

    box-shadow:
        0 0 18px rgba(21,156,255,.8);
}


/* 手机端 */
@media(max-width:600px){

    .bottom-title{
        padding:30px 8px 22px;
    }

    .bottom-title h1{
        font-size:30px;
        letter-spacing:1px;
        margin-bottom:14px;
    }

    .bottom-title p{
        font-size:15px;
        letter-spacing:1px;
    }

    .bottom-title::after{
        width:120px;
        margin-top:18px;
    }
}
body::before{
    content:"★　✦　★　✦　★";
    position:fixed;
    top:35px;
    left:0;
    width:100%;
    text-align:center;
    font-size:30px;
    letter-spacing:60px;
    color:rgba(255,255,255,.9);
    pointer-events:none;
    z-index:0;
}

.page{
    max-width:1200px;
    margin:0 auto;
}

.page > h1{
    text-align:center;
    margin:20px auto 40px;
    width:fit-content;
    padding:18px 90px;
    color:#fff;
    font-size:42px;
    font-weight:800;
    background:linear-gradient(135deg,#1976d2,#42a5f5);
    border-radius:0 0 28px 28px;
    box-shadow:0 8px 25px rgba(25,118,210,.25);
    position:relative;
    z-index:1;
}

.back{
    display:block;
    width:fit-content;
    margin:30px auto 10px;
    padding:10px 22px;
    border-radius:24px;
    background:#6735d8;
    color:#fff;
    text-decoration:none;
    font-size:16px;
    transition:.2s;
}

.back:hover{
    transform:translateY(-2px);
    opacity:.9;
}
    text-decoration:none;
}

.activity-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.activity-list img{
    width:100%;
    display:block;
    border-radius:14px;
}

@media(max-width:700px){
    .activity-list{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="page">

<h1>活动页面</h1>

<div class="activity-list">

<img src="9月合营佣金+新增活动-XK.jpg" alt="合营活动1">
<img src="9月合营首存复存活动-XK.png" alt="合营活动2">
<img src="9月限时热门活动(XK).png" alt="合营活动3">
<img src="9月月均日活奖励活动-XK.png" alt="合营活动4">
<img src="9月指定联赛冠军盘投注返利-XK.jpg" alt="合营活动5">
<img src="新人&首存类活动(XK).png" alt="合营活动6">

</div>

<!-- 底部标题 -->
<div class="bottom-title">
    <h1>活动中心</h1>
    <p>精选活动 · 福利活动 · 限时活动</p>
</div>

<a href="index.html" class="back">← 返回首页</a>
</div>

</body>
</html>
