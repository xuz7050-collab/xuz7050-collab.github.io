.cards{

.card{

.item-link{

  font-size:22px;

.green-btn{

  align-items:center;
  gap:8px;
  margin-top:12px;
  padding:13px 30px;
  background:linear-gradient(135deg,#28b94e,#178938);
  color:#fff;
  border-radius:25px;
  text-decoration:none;
  font-weight:bold;
}

.footer{
  margin-top:20px;
  display:flex;
  justify-content:center;

  gap:12px;

}

.tag{

  font-weight:bold;

@media(max-width:768px){
