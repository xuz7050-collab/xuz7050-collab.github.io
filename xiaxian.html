<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>推广方法指南</title>

<style>
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at 50% 0%,rgba(0,120,255,.22),transparent 35%),
        linear-gradient(180deg,#061b3a 0%,#04152f 55%,#020d20 100%);
    color:#fff;
    font-family:Arial,"Microsoft YaHei",sans-serif;
}

.page{
    width:100%;
    max-width:1280px;
    margin:0 auto;
    padding:0 28px 80px;
}

/* 顶部标题 */
.page-header{
    text-align:center;
    padding:55px 20px 30px;
    position:relative;
}

.page-header::after{
    content:"";
    display:block;
    width:180px;
    height:3px;
    margin:25px auto 0;
    background:linear-gradient(
        90deg,
        transparent,
        #159cff,
        #5ee7ff,
        #159cff,
        transparent
    );
    box-shadow:0 0 18px rgba(21,156,255,.8);
}

.page-header h1{
    margin:0 0 14px;
    font-size:52px;
    line-height:1.2;
    font-weight:800;
    letter-spacing:2px;
    color:#e9f7ff;
    text-shadow:
        0 0 10px rgba(60,180,255,.7),
        0 0 25px rgba(20,120,255,.45);
}

.page-header p{
    margin:0;
    font-size:22px;
    color:#9bdcff;
    letter-spacing:2px;
}

/* 中间大图片 */
.poster{
    width:100%;
    max-width:1200px;
    height:auto;
    display:block;
    margin:5px auto 45px;
    border-radius:24px;
    border:2px solid rgba(52,190,255,.75);
    box-shadow:
        0 0 15px rgba(0,140,255,.7),
        0 0 45px rgba(0,100,255,.35),
        0 25px 70px rgba(0,0,0,.45);
    object-fit:contain;
}

/* 内容区域 */
.content{
    width:100%;
    max-width:1160px;
    margin:0 auto;
}

/* 内容卡片 */
.item{
    position:relative;
    padding:30px 35px;
    margin:0 0 20px;
    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            rgba(8,47,91,.92),
            rgba(3,25,55,.92)
        );

    border:1px solid rgba(54,177,255,.35);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 10px 30px rgba(0,0,0,.25);

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}

.item:hover{
    transform:translateY(-4px);
    border-color:rgba(75,205,255,.75);

    box-shadow:
        0 12px 35px rgba(0,120,255,.25),
        inset 0 0 20px rgba(0,150,255,.05);
}

.item h2{
    margin:0 0 15px;
    font-size:27px;
    line-height:1.3;
    color:#ffd84d;
    text-shadow:0 0 10px rgba(255,200,50,.25);
}

.item p{
    margin:0;
    font-size:18px;
    line-height:1.8;
    color:#d9efff;
}

/* 核心原则 */
.content > p,
.content > div:last-child{
    color:#bfe8ff;
}

/* 平板 */
@media(max-width:900px){

    .page{
        padding:0 18px 60px;
    }

    .page-header{
        padding:40px 10px 25px;
    }

    .page-header h1{
        font-size:40px;
    }

    .page-header p{
        font-size:18px;
    }

    .poster{
        margin-bottom:35px;
        border-radius:18px;
    }

    .item{
        padding:25px;
    }

    .item h2{
        font-size:24px;
    }
}

/* 手机 */
@media(max-width:600px){

    .page{
        padding:0 12px 40px;
    }

    .page-header{
        padding:30px 8px 22px;
    }

    .page-header h1{
        font-size:30px;
        letter-spacing:1px;
    }

    .page-header p{
        font-size:15px;
        letter-spacing:1px;
    }

    .page-header::after{
        width:120px;
        margin-top:18px;
    }

    .poster{
        margin-bottom:25px;
        border-radius:14px;
        border-width:1px;
    }

    .item{
        padding:20px;
        margin-bottom:14px;
        border-radius:14px;
    }

    .item h2{
        font-size:21px;
    }

    .item p{
        font-size:15px;
        line-height:1.7;
    }
}
</style>
</head>

<body>

<div class="page">

    <header class="page-header">
        <h1>代理如何发展线下会员</h1>
        <p>线上引流 · 线下拓客 · 长期稳定增长</p>
    </header>

    <img src="photo_2026-09-15_11-54-54修改后.jpg" class="poster" alt="推广指南">

    <div class="content">

        <div class="item">
            <h2>① 内容运营</h2>
            <p>通过短视频、图文等方式持续输出有价值的内容。</p>
        </div>

        <div class="item">
            <h2>② 直播互动</h2>
            <p>通过直播讲解、互动答疑与用户建立长期联系。</p>
        </div>

        <div class="item">
            <h2>③ 搜索曝光</h2>
            <p>优化网站内容，提高自然搜索曝光。</p>
        </div>

        <div class="item">
            <h2>④ 社群运营</h2>
            <p>通过兴趣社群和行业交流建立稳定的用户关系。</p>
        </div>

        <div class="item">
            <h2>⑤ 线下推广</h2>
            <p>合理使用宣传物料和线下活动扩大品牌曝光。</p>
        </div>

        <div class="highlight">
            ⭐ 核心原则：持续提供价值，重视用户体验与长期运营。
        </div>

    </div>

</div>

</body>
</html>
